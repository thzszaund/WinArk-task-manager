name: Build WinArk (Windows Vista/7 Compatible)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  diagnose:
    name: "Diagnose Build Environment"
    runs-on: windows-2022
    steps:
      - name: "1. Checkout"
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: "2. List files"
        run: |
          echo "=== Root Files ==="
          dir /B
          echo.
          echo "=== .github/workflows ==="
          dir .github\workflows /B
          echo.
          echo "=== Solution Files ==="
          dir /S /B *.sln

      - name: "3. Setup MSBuild"
        uses: microsoft/setup-msbuild@v1.1.3

      - name: "4. Verify MSBuild"
        run: |
          where msbuild.exe
          msbuild.exe -version

      - name: "5. Try simple build"
        run: |
          msbuild.exe Anti-Rootkit.sln -t:Rebuild /p:Configuration=Release /p:Platform=x64 /v:minimal
        continue-on-error: true

