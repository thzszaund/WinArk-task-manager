name: Build WinArk

on:
  push:
    branches: [ master ]
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

env:
  SDKVER: 10.0.22000.0

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86
            zplat: Win32
            zdir: ReleaseX86Kernel
          - platform: x64
            zplat: x64
            zdir: ReleaseX64Kernel
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: microsoft/setup-msbuild@v2

    - name: Install SDK + WDK 22000
      run: |
        $inc = "C:\Program Files (x86)\Windows Kits\10\Include\$env:SDKVER"
        if (-not (Test-Path $inc)) { choco install windows-sdk-11-version-21h2-all -y --no-progress }
        Invoke-WebRequest "https://go.microsoft.com/fwlink/?linkid=2166289" -OutFile wdksetup.exe
        Start-Process .\wdksetup.exe -ArgumentList "/quiet","/norestart" -Wait
        Write-Host "::notice::ntifs: $(Test-Path "$inc\km\ntifs.h")"
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        $vsix = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Vsix" -Recurse -Filter "WDK.vsix" | Where-Object { $_.FullName -match "VS2022" } | Select-Object -First 1
        Write-Host "::notice::VSIX: $($vsix.FullName)"
        Start-Process "$vs\Common7\IDE\VSIXInstaller.exe" -ArgumentList "/quiet","/admin",$vsix.FullName -Wait

    - name: Build Zydis + Zycore (kernel, ${{ matrix.platform }})
      run: |
        $ok = $true
        foreach ($p in @("deps/zydis/msvc/dependencies/zycore/Zycore.vcxproj","deps/zydis/msvc/zydis/Zydis.vcxproj")) {
          msbuild $p /p:Configuration="Release Kernel" /p:Platform=${{ matrix.zplat }} /p:WindowsTargetPlatformVersion=$env:SDKVER /v:minimal /nologo *> zy.log
          if ($LASTEXITCODE -ne 0) {
            $ok = $false
            Get-Content zy.log | Where-Object { $_ -match ': (fatal )?error ' } | Select-Object -Unique -First 6 | ForEach-Object { Write-Host "::error::$($_.Trim().Substring(0,[Math]::Min(420,$_.Trim().Length)))" }
          }
        }
        $dir = (Resolve-Path "deps/zydis/msvc/bin/${{ matrix.zdir }}").Path
        Get-ChildItem $dir | ForEach-Object { Write-Host "::notice::ZLIB: $($_.Name)" }
        "LIB=$dir;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        if (-not $ok) { exit 1 }

    - name: NuGet restore
      run: nuget restore Anti-Rootkit.sln

    - name: Build WinArk (${{ matrix.platform }})
      run: |
        msbuild Anti-Rootkit.sln -t:WinArk /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:WindowsTargetPlatformVersion=$env:SDKVER /v:minimal /nologo *> build.log
        $code = $LASTEXITCODE
        Get-Content build.log | Select-Object -Last 25
        Get-Content build.log | Where-Object { $_ -match ': (fatal )?error ' } | Select-Object -Unique -First 10 | ForEach-Object {
          $m = $_.Trim(); if ($m.Length -gt 450) { $m = $m.Substring(0,450) }
          Write-Host "::error::$m"
        }
        exit $code

    - name: List outputs
      if: success()
      run: |
        Get-ChildItem -Recurse -Include *.exe,*.sys,*.dll | Where-Object { $_.FullName -match '\\Release\\' -and $_.FullName -notmatch '\\(obj|_deps|packages)\\' } | ForEach-Object { $_.FullName }

    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: WinArk-${{ matrix.platform }}
        path: |
          **/Release/*.exe
          **/Release/*.sys
          **/Release/*.dll
        if-no-files-found: warn
