name: Build WinArk

on:
  push:
    branches: [ master ]
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

env:
  SDKVER: 10.0.19041.0

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86
            zplat: Win32
            zdir: ReleaseX86Kernel
          - platform: x64
            zplat: x64
            zdir: ReleaseX64Kernel
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: microsoft/setup-msbuild@v2

    - name: Install WDK 19041 and retarget toolset v142 -> v143
      run: |
        choco install windowsdriverkit10 -y --no-progress
        $kits = "C:\Program Files (x86)\Windows Kits\10"
        Write-Host "::notice::ntifs19041: $(Test-Path "$kits\Include\$env:SDKVER\km\ntifs.h")  build19041: $(Test-Path "$kits\build\$env:SDKVER")"
        Get-ChildItem -Recurse -Filter *.vcxproj | ForEach-Object {
          $c = Get-Content $_.FullName -Raw
          if ($c -match '<PlatformToolset>v142</PlatformToolset>') {
            ($c -replace '<PlatformToolset>v142</PlatformToolset>','<PlatformToolset>v143</PlatformToolset>') | Set-Content $_.FullName -NoNewline
          }
        }

    - name: Build Zydis + Zycore (kernel, ${{ matrix.platform }})
      run: |
        $ok = $true
        foreach ($p in @("deps/zydis/msvc/dependencies/zycore/Zycore.vcxproj","deps/zydis/msvc/zydis/Zydis.vcxproj")) {
          msbuild $p /p:Configuration="Release Kernel" /p:Platform=${{ matrix.zplat }} /p:WindowsTargetPlatformVersion=$env:SDKVER /v:minimal /nologo *> zy.log
          if ($LASTEXITCODE -ne 0) {
            $ok = $false
            Get-Content zy.log | Where-Object { $_ -match ': (fatal )?error ' } | Select-Object -Unique -First 6 | ForEach-Object { Write-Host "::error::$($_.Trim().Substring(0,[Math]::Min(420,$_.Trim().Length)))" }
          }
        }
        $dir = (Resolve-Path "deps/zydis/msvc/bin/${{ matrix.zdir }}").Path
        Get-ChildItem $dir | ForEach-Object { Write-Host "::notice::ZLIB: $($_.Name)" }
        "LIB=$dir;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        if (-not $ok) { exit 1 }

    - name: NuGet restore
      run: nuget restore Anti-Rootkit.sln

    - name: Build WinArk (${{ matrix.platform }})
      run: |
        msbuild Anti-Rootkit.sln -t:WinArk /p:Configuration=Release /p:Platform=${{ matrix.platform }} /v:minimal /nologo *> build.log
        $code = $LASTEXITCODE
        Get-Content build.log | Select-Object -Last 25
        Get-Content build.log | Where-Object { $_ -match ': (fatal )?error ' } | Select-Object -Unique -First 10 | ForEach-Object {
          $m = $_.Trim(); if ($m.Length -gt 450) { $m = $m.Substring(0,450) }
          Write-Host "::error::$m"
        }
        exit $code

    - name: List outputs
      if: success()
      run: |
        Get-ChildItem -Recurse -Include *.exe,*.sys,*.dll | Where-Object { $_.FullName -match '\\Release\\' -and $_.FullName -notmatch '\\(obj|_deps|packages)\\' } | ForEach-Object { $_.FullName }

    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: WinArk-${{ matrix.platform }}
        path: |
          **/Release/*.exe
          **/Release/*.sys
          **/Release/*.dll
        if-no-files-found: warn
