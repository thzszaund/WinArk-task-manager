name: Build WinArk

on:
  push:
    branches: [ master ]
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x86, x64]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: microsoft/setup-msbuild@v2

    - name: Environment info
      run: |
        Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" | Select-Object -ExpandProperty Name
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -property installationPath
        Get-ChildItem "$vs\MSBuild\Microsoft\VC\v170\Platforms\x64\PlatformToolsets" | Select-Object -ExpandProperty Name
        Test-Path "C:\Program Files (x86)\Windows Kits\10\Vsix\VS2022"

    - name: NuGet restore
      run: |
        nuget restore Anti-Rootkit.sln

    - name: Build WinArk (${{ matrix.platform }})
      run: |
        msbuild Anti-Rootkit.sln -t:WinArk /p:Configuration=Release /p:Platform=${{ matrix.platform }} /v:minimal /nologo *> build.log
        $code = $LASTEXITCODE
        Get-Content build.log | Select-Object -Last 30
        $errs = Get-Content build.log | Where-Object { $_ -match ': (fatal )?error ' } | Select-Object -Unique -First 10
        foreach ($e in $errs) {
          $m = $e.Trim()
          if ($m.Length -gt 450) { $m = $m.Substring(0,450) }
          Write-Host "::error::$m"
        }
        exit $code

    - name: List outputs
      if: success()
      run: |
        Get-ChildItem -Recurse -Include *.exe,*.sys,*.dll | Where-Object { $_.FullName -match 'Release' -and $_.FullName -notmatch '\\(obj|_deps|packages)\\' } | ForEach-Object { $_.FullName }

    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: WinArk-${{ matrix.platform }}
        path: |
          **/Release/*.exe
          **/Release/*.sys
          **/Release/*.dll
        if-no-files-found: warn
